// DEV/TEST ONLY -- adds the in-progress ProceduralShapeSpine as a selectable shape on the
// procedural structural element so it can be tested in the editor. Remove before the PR (or
// replace with real fuselage parts that ship the spine shape).
@PART[proceduralStructural]:FOR[ProceduralParts]
{
	MODULE
	{
		name = ProceduralShapeSpine
		displayName = Spine
		length = 2.0
		hScale = 1.0
		vScale = 1.0

		SPINE_NODE { position = 0.0 sizeH = 1.25 sizeV = 1.25 }
		SPINE_NODE { position = 0.5 sizeH = 1.80 sizeV = 1.00 }
		SPINE_NODE { position = 1.0 sizeH = 0.80 sizeV = 0.80 }
	}
}
